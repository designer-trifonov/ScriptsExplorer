<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      -webkit-user-select: none;
      cursor: pointer;
    }
    #pill {
      height: 32px;
      margin-top: 8px;
      border-radius: 16px;
      background: rgba(64, 64, 64, 0.7);
      color: white;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      white-space: nowrap;
    }
    #pill:hover  { background: rgba(86, 86, 86, 0.7); }
    #pill:active { background: rgba(44, 44, 44, 0.7); }
  </style>
</head>
<body>
  <div id="pill">Script Explorer</div>
  <script src="start-button.js"></script>
</body>
</html>
